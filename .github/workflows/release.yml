name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to create or update'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'GitHub Release display name'
        required: true
        default: 'NaatBook v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Validate release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release builds must be dispatched from main. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/naatbook-release.jks"
          test -s "${RUNNER_TEMP}/naatbook-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/naatbook-release.jks
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/NaatBook-${RELEASE_TAG}-release.apk"
          ls -lh release-artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          asset="release-artifacts/NaatBook-${RELEASE_TAG}-release.apk"
          notes="Signed Android release APK for ${RELEASE_NAME}."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${asset}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${asset}" \
              --title "${RELEASE_NAME}" \
              --notes "${notes}" \
              --target "${GITHUB_SHA}"
          fi
          
